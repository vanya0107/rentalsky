<div class="rs-popup-img" data-popup-img>
    <div class="rs-popup-img__overlay" data-popup-close></div>
    <button type="button" class="rs-popup-img__close" data-popup-close>
        <span>close</span>
    </button>
    <div class="rs-popup-img__slider swiper"></div>
    <button type="button" class="rs-popup-img__slider_arrow prev">
        <span class="rs-text-hidden">prev slide</span>
    </button>
    <button type="button" class="rs-popup-img__slider_arrow next">
        <span class="rs-text-hidden">next slide</span>
    </button>
</div>
