    - generic [ref=e79]:
      - heading "Аренда автовышек" [level=2] [ref=e81]
      - paragraph [ref=e82]: В мире строительства, ремонта, монтажа, демонтажа и обслуживания высотных объектов, аренда автовышек стала неотъемлемой частью многих проектов и сфер жизни. Наша команда предлагает квалифицированных, опытных операторов и широкий спектр автовышек в аренду, чтобы удовлетворить ваши потребности в безопасном и эффективном доступе на высоту.
      - heading "Преимущества аренды автовышек:" [level=3] [ref=e83]
      - list [ref=e84]:
        - listitem [ref=e85]: "Безопасность: наши автовышки оснащены всеми необходимыми системами безопасности, чтобы обеспечить защиту вашей жизни и здоровья."
        - listitem [ref=e86]: "Эффективность: благодаря высокой мобильности и маневренности, наши автовышки позволяют быстро и легко выполнять работы на высоте, даже в самых труднодоступных местах ."
        - listitem [ref=e87]: "Широкий выбор: наша компания предлагает широкий спектр автовышек разной высоты и грузоподъемности, чтобы удовлетворить ваши конкретные потребности."
        - listitem [ref=e88]: "Экономичность: аренда автовышек - это более экономичный вариант, чем покупка собственного оборудования, особенно если вы не планируете использовать его постоянно."
    - generic [ref=e92]:
      - heading "Как формируется цена аренды автовышки" [level=2] [ref=e94]
      - paragraph [ref=e95]: "Цена аренды автовышки формируется на основе нескольких факторов, которые могут варьироваться. Ниже приведены основные факторы, которые влияют на цену аренды автовышки:"
      - list [ref=e96]:
        - listitem [ref=e97]:
          - paragraph [ref=e98]: "Тип и модель автовышки:"
          - paragraph [ref=e100]: Цена аренды может различаться в зависимости от типа и модели автовышки. Например, более крупные и мощные автовышки могут иметь более высокую стоимость аренды.
        - listitem [ref=e101]:
          - paragraph [ref=e102]: "Продолжительность аренды:"
          - paragraph [ref=e104]: Обычно цена аренды автовышки зависит от продолжительности аренды. Чем дольше срок аренды, тем выгоднее может быть стоимость за день или за час.
        - listitem [ref=e105]:
          - paragraph [ref=e106]: "Местоположение:"
          - paragraph [ref=e108]: В цену аренды автовышек включается стоимость доставки техники за пределы Минска.
        - listitem [ref=e109]:
          - paragraph [ref=e110]: "Спрос и предложение:"
          - paragraph [ref=e112]: В некоторых случаях цена аренды может зависеть от текущего спроса и предложения на рынке аренды автовышек.
        - listitem [ref=e113]:
          - paragraph [ref=e114]: "Длительность сотрудничества с заказчиком:"
          - paragraph [ref=e116]: Постоянным и новым клиентам мы предоставляем скидки.
    - generic [ref=e117]:
