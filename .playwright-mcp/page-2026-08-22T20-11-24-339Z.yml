      - paragraph [ref=e120]: "Чтобы правильно подобрать автовышку, необходимо обратить внимание на следующие факторы:"
      - list [ref=e121]:
        - listitem [ref=e122]:
          - paragraph [ref=e123]: Высота подъема
          - paragraph [ref=e124]: Нужно определиться, на какую высоту необходимо совершить подъем.
        - listitem [ref=e125]:
          - paragraph [ref=e126]: Грузоподъемность
          - paragraph [ref=e127]: Общий вес рабочей группы и используемого инструмента, оборудования не должен превышать максимальной грузоподъемности автовышки.
        - listitem [ref=e128]:
          - paragraph [ref=e129]: Маневренность
          - paragraph [ref=e130]: Если работы будут проводиться в ограниченном пространстве, на узких городских улочках, то стоит выбрать более компактную модель.
        - listitem [ref=e131]:
          - paragraph [ref=e132]: Пространство
          - paragraph [ref=e133]: Необходимо учитывать наличие деревьев, проводов, зданий и других препятствий.
        - listitem [ref=e134]:
          - paragraph [ref=e135]: Площадка
          - paragraph [ref=e136]: Нужно убедиться, что площадка имеет достаточное пространно для размещения автовышки с учетом вылета выносных опор.
